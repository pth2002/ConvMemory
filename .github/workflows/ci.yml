name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package
        run: pip install -e .
      - name: Compile package
        run: python -m compileall -q convmemory
      - name: Run API smoke example
        run: python examples/basic_api.py
